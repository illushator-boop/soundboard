<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Звуковая панель</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Звуковая панель</h1>

    <div class="controls">
        <input type="text" id="sound-url" placeholder="Ссылка на аудио (.mp3)">
        <input type="text" id="sound-key" placeholder="Клавиша (например: z)">
        <button id="add-btn">Добавить звук</button>
    </div>

    <div id="board" class="board"></div>

    <script src="script.js"></script>
</body>
</html>
